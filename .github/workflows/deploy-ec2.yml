name: Deploy to EC2

on:
  push:
    branches: [ v2-devall, main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

env:
  AWS_REGION: us-east-2
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ec2-user
  APP_DIR: /home/ec2-user/Vismaya-DemandOps

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: v2-devall

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Create deployment environment file
      run: |
        cat > .env.production << 'EOF'
        # AWS Configuration
        AWS_REGION=${{ env.AWS_REGION }}
        ENVIRONMENT=production
        DEBUG=false
        PORT=8503

        # Bedrock Configuration
        BEDROCK_MODEL_ID=${{ secrets.BEDROCK_MODEL_ID }}

        # Budget Configuration
        DEFAULT_BUDGET=${{ secrets.DEFAULT_BUDGET }}
        BUDGET_WARNING_LIMIT=${{ secrets.BUDGET_WARNING_LIMIT }}
        BUDGET_MAXIMUM_LIMIT=${{ secrets.BUDGET_MAXIMUM_LIMIT }}

        # AWS SSO Configuration
        SSO_START_URL=${{ secrets.SSO_START_URL }}
        SSO_REGION=${{ env.AWS_REGION }}
        SSO_ACCOUNT_ID=${{ secrets.SSO_ACCOUNT_ID }}
        SSO_ROLE_NAME=${{ secrets.SSO_ROLE_NAME }}
        AWS_USER_EMAIL=${{ secrets.AWS_USER_EMAIL }}
        EOF

    - name: Deploy to EC2
      run: |
        # Copy environment file to EC2
        scp -i ~/.ssh/id_rsa .env.production ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.APP_DIR }}/.env

        # Deploy application
        ssh -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'ENDSSH'
          set -e
          cd ${{ env.APP_DIR }}
          
          echo "🔄 Pulling latest changes..."
          git fetch origin
          git checkout v2-devall
          git pull origin v2-devall
          
          echo "🛑 Stopping current application..."
          docker-compose down || true
          
          echo "🏗️ Building application..."
          docker-compose build --no-cache
          
          echo "🚀 Starting application..."
          docker-compose up -d
          
          echo "⏳ Waiting for application to start..."
          sleep 30
          
          echo "🔍 Checking application health..."
          if curl -f http://localhost:8503/_stcore/health > /dev/null 2>&1; then
            echo "✅ Application is healthy!"
          else
            echo "❌ Application health check failed"
            docker-compose logs
            exit 1
          fi
          
          echo "📊 Application deployed successfully!"
          echo "🌐 Access at: http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4):8503"
        ENDSSH

    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        ssh -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'ENDSSH'
          cd ${{ env.APP_DIR }}
          echo "📋 Container status:"
          docker-compose ps
          
          echo "📊 Resource usage:"
          docker stats --no-stream
          
          echo "📝 Recent logs:"
          docker-compose logs --tail=20
        ENDSSH

    - name: Notify deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ Deployment successful!"
          echo "🌐 Application URL: http://${{ env.EC2_HOST }}:8503"
        else
          echo "❌ Deployment failed!"
        fi

  rollback:
    name: Rollback on failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    
    steps:
    - name: Setup SSH for rollback
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Rollback deployment
      run: |
        echo "🔄 Rolling back deployment..."
        ssh -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
          cd ${{ env.APP_DIR }}
          
          echo "🛑 Stopping failed deployment..."
          docker-compose down || true
          
          echo "⏪ Rolling back to previous version..."
          git checkout HEAD~1
          
          echo "🚀 Starting previous version..."
          docker-compose up -d
          
          echo "✅ Rollback completed"
        ENDSSH